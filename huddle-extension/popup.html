<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 250px;
      padding: 15px;
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
    }
    h3 { text-align: center; color: #4ade80; margin: 0 0 15px 0; }
    .box {
      background: #2a2a2a;
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0;
      text-align: center;
    }
    .label { font-size: 11px; color: #888; }
    .value { font-size: 15px; font-weight: bold; margin: 5px 0; }
    button {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
      background: #4ade80;
      color: #000;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #22c55e; }
    .online { color: #4ade80; }
    .offline { color: #ef4444; }
  </style>
</head>
<body>
  <h3>🎙️ Huddle Recorder</h3>
  <div class="box">
    <div class="label">Status</div>
    <div id="status" class="value offline">Checking...</div>
  </div>
  <button id="refresh">🔄 Refresh</button>
  <script src="popup.js"></script>
</body>
</html>
